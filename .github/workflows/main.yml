name: Android debug APK

on:
  push:
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/

      - name: Setup Android (debug keystore + editor settings)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          godot --headless --quit || true
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android APK" build/nyctos-adventure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyctos-adventure-debug-apk
          path: build/nyctos-adventure.apk
