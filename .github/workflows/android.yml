name: Android debug APK

on:
  push:
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/

      - name: Setup Android (Java, debug keystore, editor settings)
        run: |
          if ! command -v javac >/dev/null 2>&1; then
            apt-get update && apt-get install -y openjdk-17-jdk-headless
          fi
          JDK=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "Java path: $JDK"
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}
          echo "Android SDK path: $SDK"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot --headless --quit || true
          CFG=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "Editor settings file: $CFG"
          {
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo "export/android/debug_keystore = \"/root/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
            echo "export/android/shutdown_adb_on_exit = true"
          } >> "$CFG"
          tail -8 "$CFG"

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android APK" build/nyctos-adventure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyctos-adventure-debug-apk
          path: build/nyctos-adventure.apk
